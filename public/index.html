<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MatchPoint - Torneos, pronósticos y créditos virtuales de Nexo Digital Labs">
  <title>MatchPoint | Torneos, pronósticos y créditos virtuales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand" data-route="home">
        <span class="brand-mark">MP</span>
        <span class="brand-name">Match<span>Point</span></span>
      </a>

      <nav class="main-nav" id="main-nav">
        <a href="#/" data-route="home">Inicio</a>
        <a href="#/tournaments" data-route="tournaments">Torneos</a>
        <a href="#/events" data-route="events">Eventos</a>
        <a href="#/admin" data-route="admin" id="admin-link" class="hidden">Administración</a>
      </nav>

      <div class="header-actions">
        <a href="#/credits" data-route="credits" class="credits-pill" title="Mis créditos">
          <span class="coin">◈</span><span id="credits-badge">0</span>
        </a>
        <div id="auth-buttons" class="auth-buttons">
          <a href="#/login" data-route="login" class="btn btn-ghost small">Ingresar</a>
          <a href="#/register" data-route="register" class="btn btn-primary small">Registrarse</a>
        </div>
        <div id="user-menu" class="user-menu hidden">
          <a href="#/profile" data-route="profile" class="user-name" id="greeting">Mi cuenta</a>
          <a href="#/" data-route="logout" class="btn btn-ghost small">Salir</a>
        </div>
      </div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>MatchPoint</strong> · Plataforma de gestión de torneos, pronósticos y créditos virtuales
      </div>
      <div class="muted small">Nexo Digital Labs · Los créditos son virtuales y no tienen valor monetario.</div>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
